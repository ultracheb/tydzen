<!doctype html>
<html lang="be">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6f4ef" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#171614" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Капшук</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>👛</text></svg>">
<style>
:root{
  --bg:#f6f4ef; --card:#fff; --ink:#1f1d1a; --muted:#78736a; --line:#e7e2d8;
  --accent:#2f6f5e; --accent-soft:#e2efe9;
  --c-rec:#4a6fa5; --c-bud:#d08a2e; --c-one:#b5536b; --c-free:#2f6f5e; --c-jar:#7a5cc2; --jar-glass:rgba(140,170,200,.13);
  --danger:#b5443a; --radius:14px;
  --safe-b:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#171614; --card:#211f1c; --ink:#ece8e1; --muted:#9a948a; --line:#34312c;
    --accent:#6cbfa5; --accent-soft:#1f3530;
    --c-rec:#7fa3d6; --c-bud:#e3a650; --c-one:#d97a93; --c-free:#6cbfa5; --danger:#e07467; --c-jar:#a98ef0; --jar-glass:rgba(200,220,255,.08);
  }
}
:root[data-theme="dark"]{
  --bg:#171614; --card:#211f1c; --ink:#ece8e1; --muted:#9a948a; --line:#34312c;
  --accent:#6cbfa5; --accent-soft:#1f3530;
  --c-rec:#7fa3d6; --c-bud:#e3a650; --c-one:#d97a93; --c-free:#6cbfa5; --danger:#e07467; --c-jar:#a98ef0; --jar-glass:rgba(200,220,255,.08);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overscroll-behavior-y:none}
button,input,select{font:inherit;color:inherit}
.wrap{max-width:920px;margin:0 auto;padding:0 16px 24px}

/* header */
header{position:sticky;top:0;z-index:10;background:var(--bg);display:flex;align-items:center;gap:10px;padding:12px 0 10px;padding-top:max(12px,env(safe-area-inset-top))}
header h1{font-size:20px;margin:0;flex:1;display:flex;align-items:center;gap:6px;white-space:nowrap}
.month-nav{display:flex;align-items:center;gap:4px}
.month-nav b{min-width:128px;text-align:center;text-transform:capitalize;font-size:15px}
.lang{display:flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--card)}
.lang button{border:0;background:none;padding:6px 9px;font-size:12px;font-weight:600;color:var(--muted);cursor:pointer}
.lang button.on{background:var(--accent);color:#fff}

.btn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 12px;cursor:pointer;min-height:38px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.sm{padding:5px 10px;font-size:13px;min-height:32px}
.btn.icon{width:38px;padding:0;font-size:18px}
.btn.round{width:38px;height:38px;padding:0;border-radius:50%;font-size:20px;line-height:1}

.tabs{display:flex;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:4px;margin-bottom:16px}
.tabs button{flex:1;border:0;background:none;padding:8px 10px;border-radius:9px;cursor:pointer;white-space:nowrap;color:var(--muted);display:flex;align-items:center;justify-content:center;gap:6px}
.tabs button svg{width:18px;height:18px;display:none}
.tabs button.on{background:var(--accent-soft);color:var(--ink);font-weight:600}

/* stats */
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:12px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;min-width:0}
.stat small{color:var(--muted);display:block;font-size:12px}
.stat b{font-size:20px;font-variant-numeric:tabular-nums;white-space:nowrap}
.stat .sub{font-size:12px;color:var(--muted)}
.stat.hero{grid-column:span 1}
.neg{color:var(--danger)!important}
.bar{display:flex;height:14px;border-radius:7px;overflow:hidden;background:var(--line);margin:4px 0 6px}
.bar span{display:block;height:100%}
.legend{display:flex;gap:6px 14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-bottom:18px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}

/* cards & rows */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-bottom:14px}
.card h2{font-size:16px;margin:0;display:flex;align-items:center;gap:8px}
.card h2 .dot{width:10px;height:10px;border-radius:50%;flex:none}
.card-head{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.card-head h2{flex:1;min-width:0}
.card-head .total{color:var(--muted);font-variant-numeric:tabular-nums;font-size:13px;white-space:nowrap}
.hint{color:var(--muted);font-size:13px;margin:0 0 6px}
.row{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line);min-height:52px}
.row:first-of-type{border-top:0}
.row.tap{cursor:pointer}
.row.tap:active{background:var(--accent-soft);margin:0 -14px;padding-left:14px;padding-right:14px}
.row .name{flex:1;min-width:0}
.row .name>div:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .meta{font-size:12px;color:var(--muted)}
.row .amt{font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right}
.row.done .name>div:first-child{text-decoration:line-through;color:var(--muted)}
.row.off{opacity:.5}
.chk{appearance:none;-webkit-appearance:none;width:26px;height:26px;border:2px solid var(--line);border-radius:8px;flex:none;cursor:pointer;display:grid;place-items:center;margin:0;background:var(--card)}
.chk:checked{background:var(--accent);border-color:var(--accent)}
.chk:checked::after{content:"";width:7px;height:12px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px)}
.empty{color:var(--muted);font-size:13px;padding:10px 0}
.prog{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:6px}
.prog span{display:block;height:100%;background:var(--c-bud)}
.prog span.over{background:var(--danger)}
.tag{font-size:11px;padding:1px 7px;border-radius:20px;background:var(--accent-soft);color:var(--ink);margin-left:6px;vertical-align:1px}

/* year */
.year{display:grid;grid-template-columns:repeat(12,1fr);gap:5px;align-items:end;height:200px;margin:10px 0 4px}
.ycol{display:flex;flex-direction:column;justify-content:flex-end;height:100%;position:relative;cursor:pointer}
.ycol .stack{display:flex;flex-direction:column-reverse;border-radius:5px 5px 0 0;overflow:hidden}
.ycol .inc{position:absolute;left:-2px;right:-2px;border-top:2px dashed var(--muted)}
.ycol.cur .stack{outline:2px solid var(--ink);outline-offset:1px}
.ylabels{display:grid;grid-template-columns:repeat(12,1fr);gap:5px;font-size:11px;color:var(--muted);text-align:center}
table{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
th,td{padding:8px 4px;text-align:right;border-top:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left;text-transform:capitalize}
th{color:var(--muted);font-weight:500}
tr.cur td{font-weight:600}
.tblwrap{overflow-x:auto}

/* fab */
.fab{position:fixed;right:max(18px,calc(50% - 460px + 18px));bottom:calc(24px + var(--safe-b));z-index:20;width:58px;height:58px;border-radius:50%;border:0;background:var(--accent);color:#fff;font-size:30px;line-height:1;box-shadow:0 6px 18px rgba(0,0,0,.25);cursor:pointer}
.fab:active{transform:scale(.95)}

/* dialog */
dialog{border:1px solid var(--line);border-radius:16px;background:var(--card);color:var(--ink);padding:0;width:min(440px,calc(100% - 32px));max-height:90vh;overflow:auto}
dialog::backdrop{background:rgba(0,0,0,.45)}
dialog form{padding:18px}
dialog h3{margin:0 0 14px;font-size:18px}
.field{display:block;margin-bottom:12px}
.field span{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
.field input,.field select{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);font-size:16px;min-height:44px}
.field input.big{font-size:26px;font-weight:600;font-variant-numeric:tabular-nums}
.field.inline{display:flex;align-items:center;gap:10px;font-size:15px}
.field.inline input{width:auto;min-height:0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
.actions .del{margin-right:auto;color:var(--danger)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.chips label{cursor:pointer}
.chips input{display:none}
.chips span{display:inline-block;padding:8px 12px;border:1px solid var(--line);border-radius:20px;font-size:14px;background:var(--bg)}
.chips input:checked+span{background:var(--accent);border-color:var(--accent);color:#fff}
.sheet-list button{display:flex;width:100%;align-items:center;gap:12px;padding:14px 4px;border:0;border-top:1px solid var(--line);background:none;cursor:pointer;text-align:left;font-size:16px}
.sheet-list button:first-child{border-top:0}
.sheet-list .dot{width:12px;height:12px;border-radius:50%}
footer{color:var(--muted);font-size:12px;text-align:center;padding:20px 0}

/* ---------- jars ---------- */
.jars{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.jar-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:12px 10px 12px;text-align:center;cursor:pointer;position:relative}
.jar-card:active{transform:scale(.98)}
.jar-card .jn{font-weight:600;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.jar-card .jm{font-size:12px;color:var(--muted)}
.jar-card .jadd{position:absolute;top:8px;right:8px}
.jar{width:96px;height:auto;display:block;margin:0 auto;overflow:visible}
.jar .glass{fill:var(--jar-glass)}
.jar .outline{fill:none;stroke:var(--ink);stroke-width:2.4;opacity:.75}
.jar .shine{fill:none;stroke:#fff;stroke-width:3;stroke-linecap:round;opacity:.5}
.jar .wave{animation:wave 2.6s linear infinite}
.jar .wave2{animation:wave 4s linear infinite reverse;opacity:.45}
.jar .fill{transition:transform 1s cubic-bezier(.3,1.3,.5,1)}
@keyframes wave{to{transform:translateX(-50px)}}
.mini-jars{display:flex;gap:6px;overflow-x:auto;padding:4px 0 2px;scrollbar-width:none}
.mini-jars .mj{flex:0 0 78px;text-align:center;cursor:pointer;font-size:11px;color:var(--muted)}
.mini-jars .mj .jar{width:56px}
.mini-jars .mj b{display:block;color:var(--ink);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.swatches{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.swatches label{cursor:pointer}
.swatches input{display:none}
.swatches i{display:block;width:30px;height:30px;border-radius:50%;border:3px solid transparent;box-shadow:inset 0 0 0 2px var(--card)}
.swatches input:checked+i{border-color:var(--ink)}
.wrap-btn{display:block;width:100%;border:0;border-radius:var(--radius);padding:14px;margin:-4px 0 16px;font-weight:700;font-size:15px;color:#fff;cursor:pointer;background:linear-gradient(115deg,#6a3fd1,#d04a8a 55%,#f0a340);box-shadow:0 4px 14px rgba(106,63,209,.25)}

/* ---------- confetti ---------- */
#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:70}

/* ---------- seasons ---------- */
#season{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.wrap{position:relative;z-index:1}
#season span{position:absolute;top:-40px;animation:fall linear infinite;opacity:.55;will-change:transform}
#season.up span{top:auto;bottom:-30px;animation-name:rise}
@keyframes fall{0%{transform:translate(0,0) rotate(0)}25%{transform:translate(18px,27vh) rotate(90deg)}50%{transform:translate(-12px,55vh) rotate(180deg)}75%{transform:translate(14px,82vh) rotate(270deg)}100%{transform:translate(0,112vh) rotate(360deg)}}
@keyframes rise{0%{transform:translate(0,0);opacity:0}15%{opacity:.7}50%{transform:translate(20px,-50vh)}85%{opacity:.6}100%{transform:translate(-10px,-105vh);opacity:0}}
.garland{position:absolute;left:0;right:0;bottom:-6px;height:14px;display:flex;justify-content:space-around;pointer-events:none;border-top:1.5px solid var(--muted);border-radius:50%/0 0 100% 100%}
.garland i{width:8px;height:11px;border-radius:50% 50% 50% 50%/40% 40% 60% 60%;margin-top:1px;animation:blink 1.4s ease-in-out infinite alternate;box-shadow:0 0 6px currentColor;background:currentColor}
.garland i:nth-child(odd){animation-delay:.7s}
@keyframes blink{from{opacity:.35}to{opacity:1}}
@media (prefers-reduced-motion:reduce){#season{display:none}}

/* ---------- wrapped ---------- */
.wr{position:fixed;inset:0;z-index:80;display:none;color:#fff;user-select:none;-webkit-user-select:none}
.wr.on{display:block}
.wr-slide{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:60px 28px calc(60px + var(--safe-b));transition:background .5s}
.wr-bars{position:absolute;top:max(12px,env(safe-area-inset-top));left:12px;right:12px;display:flex;gap:4px;z-index:2}
.wr-bars i{flex:1;height:3px;border-radius:2px;background:rgba(255,255,255,.35);overflow:hidden}
.wr-bars i b{display:block;height:100%;width:0;background:#fff}
.wr-close{position:absolute;top:max(22px,calc(env(safe-area-inset-top) + 10px));right:12px;z-index:3;background:none;border:0;color:#fff;font-size:28px;cursor:pointer;width:44px;height:44px}
.wr-k{font-size:15px;opacity:.85;text-transform:uppercase;letter-spacing:.08em;margin-bottom:10px}
.wr-big{font-size:clamp(38px,11vw,64px);font-weight:800;line-height:1.05;font-variant-numeric:tabular-nums;animation:pop .6s cubic-bezier(.3,1.5,.5,1) both}
.wr-mid{font-size:clamp(24px,7vw,36px);font-weight:800;line-height:1.15;animation:pop .6s cubic-bezier(.3,1.5,.5,1) both}
.wr-sub{font-size:16px;opacity:.9;margin-top:14px;max-width:420px;animation:fadeUp .6s .25s both}
.wr-emoji{font-size:64px;margin-bottom:8px;animation:pop .6s cubic-bezier(.3,1.5,.5,1) both}
.wr-face{width:120px;height:auto;margin-bottom:10px;animation:wobble 1.2s ease-in-out infinite alternate}
.wr-share{margin-top:24px;background:#fff;color:#222;border:0;border-radius:30px;padding:12px 26px;font-weight:700;font-size:15px;cursor:pointer;position:relative;z-index:3}
.wr-hint{position:absolute;bottom:calc(18px + var(--safe-b));left:0;right:0;text-align:center;font-size:12px;opacity:.6}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}
@keyframes fadeUp{from{transform:translateY(12px);opacity:0}to{transform:none;opacity:.9}}
@keyframes wobble{from{transform:rotate(-8deg)}to{transform:rotate(8deg) translateY(-6px)}}

/* ---------- mascot ---------- */
.mascot{position:fixed;left:max(10px,calc(50% - 460px - 110px));bottom:calc(14px + var(--safe-b));z-index:19;width:92px;cursor:pointer;user-select:none;-webkit-user-select:none}
@media (max-width:1150px){.mascot{left:10px}}
.mascot svg{width:100%;height:auto;display:block;overflow:visible}
.mascot svg *{transform-box:view-box}
.m-stroke{stroke:#2d4a2a;stroke-width:2.2;fill:none;stroke-linecap:round}
.m-skin{fill:#8fd16a;stroke:#2d4a2a;stroke-width:2.2}
.m-belly{fill:#c5ef9f}
.m-spot{fill:#6fb24d}
.m-glow{fill:#d4ff6e;filter:drop-shadow(0 0 4px #c6ff4a)}
.m-shadow{fill:rgba(0,0,0,.18)}
.m-all{transform-origin:60px 160px}
.m-head{transform-origin:60px 68px}
.m-body{transform-origin:60px 128px}
.m-armL{transform-origin:38px 88px}
.m-armR{transform-origin:82px 88px}
.m-legL{transform-origin:52px 124px}
.m-legR{transform-origin:68px 124px}
.m-antL{transform-origin:50px 6px}
.m-antR{transform-origin:70px 6px}
.m-shadow{transform-origin:60px 162px}
.m-beam{opacity:0;fill:url(#mBeam)}

/* antennae always wobble */
.m-antL{animation:ant 1.1s ease-in-out infinite alternate}
.m-antR{animation:ant 1.1s ease-in-out infinite alternate-reverse}
@keyframes ant{from{transform:rotate(-14deg)}to{transform:rotate(12deg)}}

/* dance 1: wiggle */
.d-wiggle .m-all{animation:wigAll .5s ease-in-out infinite alternate}
.d-wiggle .m-head{animation:tilt .5s ease-in-out infinite alternate}
.d-wiggle .m-armL{animation:armUpL .5s ease-in-out infinite alternate}
.d-wiggle .m-armR{animation:armUpR .5s ease-in-out infinite alternate-reverse}
.d-wiggle .m-legL{animation:kick .5s ease-in-out infinite alternate}
.d-wiggle .m-legR{animation:kick .5s ease-in-out infinite alternate-reverse}
@keyframes wigAll{from{transform:rotate(-7deg) translateY(0)}to{transform:rotate(7deg) translateY(-4px)}}
@keyframes tilt{from{transform:rotate(10deg)}to{transform:rotate(-10deg)}}
@keyframes armUpL{from{transform:rotate(20deg)}to{transform:rotate(130deg)}}
@keyframes armUpR{from{transform:rotate(-20deg)}to{transform:rotate(-130deg)}}
@keyframes kick{from{transform:rotate(-12deg)}to{transform:rotate(14deg)}}

/* dance 2: robot (steppy) */
.d-robot .m-all{animation:robAll 1.6s steps(4) infinite}
.d-robot .m-head{animation:robHead 1.6s steps(4) infinite}
.d-robot .m-armL{animation:robArmL 1.6s steps(4) infinite}
.d-robot .m-armR{animation:robArmR 1.6s steps(4) infinite}
@keyframes robAll{0%{transform:translate(0,0)}25%{transform:translate(4px,-3px)}50%{transform:translate(0,0)}75%{transform:translate(-4px,-3px)}}
@keyframes robHead{0%{transform:translateX(0)}25%{transform:translateX(6px) rotate(8deg)}50%{transform:translateX(0)}75%{transform:translateX(-6px) rotate(-8deg)}}
@keyframes robArmL{0%{transform:rotate(90deg)}25%{transform:rotate(0)}50%{transform:rotate(160deg)}75%{transform:rotate(45deg)}}
@keyframes robArmR{0%{transform:rotate(0)}25%{transform:rotate(-90deg)}50%{transform:rotate(-45deg)}75%{transform:rotate(-160deg)}}

/* dance 3: spin + jump */
.d-spin .m-all{animation:spin 1.4s cubic-bezier(.4,0,.3,1) infinite}
.d-spin .m-shadow{animation:shad 1.4s cubic-bezier(.4,0,.3,1) infinite}
.d-spin .m-armL{animation:armUpL .35s ease-in-out infinite alternate}
.d-spin .m-armR{animation:armUpR .35s ease-in-out infinite alternate}
@keyframes spin{0%,100%{transform:translateY(0) scaleX(1)}25%{transform:translateY(-18px) scaleX(-1)}50%{transform:translateY(-22px) scaleX(1)}75%{transform:translateY(-8px) scaleX(-1)}}
@keyframes shad{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(.55);opacity:.5}}

/* dance 4: levitate in a beam */
.d-float .m-all{animation:flo 2.4s ease-in-out infinite}
.d-float .m-beam{animation:beam 2.4s ease-in-out infinite}
.d-float .m-shadow{animation:shad 2.4s ease-in-out infinite}
.d-float .m-armL{transform:rotate(70deg);animation:flap .3s ease-in-out infinite alternate}
.d-float .m-armR{transform:rotate(-70deg);animation:flapR .3s ease-in-out infinite alternate}
.d-float .m-legL{animation:kick 1.2s ease-in-out infinite alternate}
.d-float .m-legR{animation:kick 1.2s ease-in-out infinite alternate-reverse}
.d-float .m-head{animation:tilt 1.2s ease-in-out infinite alternate}
@keyframes flo{0%,100%{transform:translateY(0) rotate(-6deg)}50%{transform:translateY(-26px) rotate(6deg)}}
@keyframes beam{0%,100%{opacity:.15}50%{opacity:.75}}
@keyframes flap{from{transform:rotate(60deg)}to{transform:rotate(85deg)}}
@keyframes flapR{from{transform:rotate(-60deg)}to{transform:rotate(-85deg)}}

/* dance 5: noodle shimmy */
.d-shimmy .m-body{animation:shim .22s linear infinite alternate}
.d-shimmy .m-head{animation:headBob .44s ease-in-out infinite alternate}
.d-shimmy .m-armL{animation:noodL .22s linear infinite alternate}
.d-shimmy .m-armR{animation:noodR .22s linear infinite alternate}
.d-shimmy .m-all{animation:squash .44s ease-in-out infinite alternate}
@keyframes shim{from{transform:skewX(-8deg)}to{transform:skewX(8deg)}}
@keyframes headBob{from{transform:translateY(0) rotate(-4deg)}to{transform:translateY(5px) rotate(4deg)}}
@keyframes noodL{from{transform:rotate(40deg)}to{transform:rotate(70deg)}}
@keyframes noodR{from{transform:rotate(-40deg)}to{transform:rotate(-70deg)}}
@keyframes squash{from{transform:scale(1,1)}to{transform:scale(1.06,.94)}}

/* dance 6: moonwalk */
.d-moon .m-all{animation:moon 2.4s ease-in-out infinite}
.d-moon .m-legL{animation:moonLeg .3s ease-in-out infinite alternate}
.d-moon .m-legR{animation:moonLeg .3s ease-in-out infinite alternate-reverse}
.d-moon .m-armL{animation:armSwing .6s ease-in-out infinite alternate}
.d-moon .m-armR{animation:armSwingR .6s ease-in-out infinite alternate}
.d-moon .m-head{transform:rotate(-8deg)}
@keyframes moon{0%,100%{transform:translateX(0) scaleX(1)}45%{transform:translateX(-14px) scaleX(1)}50%{transform:translateX(-14px) scaleX(-1)}95%{transform:translateX(0) scaleX(-1)}}
@keyframes moonLeg{from{transform:rotate(-20deg) translateY(-3px)}to{transform:rotate(8deg)}}
@keyframes armSwing{from{transform:rotate(-10deg)}to{transform:rotate(35deg)}}
@keyframes armSwingR{from{transform:rotate(10deg)}to{transform:rotate(-35deg)}}

/* dance 7: helicopter arms */
.d-heli .m-armL{animation:heli .45s linear infinite}
.d-heli .m-armR{animation:heliR .45s linear infinite}
.d-heli .m-all{animation:heliUp 1.8s ease-in-out infinite}
.d-heli .m-shadow{animation:shad 1.8s ease-in-out infinite}
.d-heli .m-legL,.d-heli .m-legR{animation:dangle .9s ease-in-out infinite alternate}
@keyframes heli{to{transform:rotate(360deg)}}
@keyframes heliR{to{transform:rotate(-360deg)}}
@keyframes heliUp{0%,100%{transform:translateY(0)}50%{transform:translateY(-20px) rotate(4deg)}}
@keyframes dangle{from{transform:rotate(-15deg)}to{transform:rotate(15deg)}}

/* dance 8: disco point */
.d-disco .m-armL{animation:discoL 1s steps(1) infinite}
.d-disco .m-armR{animation:discoR 1s steps(1) infinite}
.d-disco .m-body{animation:hips .5s ease-in-out infinite alternate}
.d-disco .m-head{animation:discoHead 1s steps(1) infinite}
.d-disco .m-legL{animation:kick .5s ease-in-out infinite alternate}
@keyframes discoL{0%{transform:rotate(150deg)}50%{transform:rotate(-20deg)}}
@keyframes discoR{0%{transform:rotate(20deg)}50%{transform:rotate(-150deg)}}
@keyframes discoHead{0%{transform:rotate(-12deg)}50%{transform:rotate(12deg)}}
@keyframes hips{from{transform:translateX(-4px) rotate(-6deg)}to{transform:translateX(4px) rotate(6deg)}}

/* dance 9: headbang */
.d-bang .m-head{animation:bang .28s ease-in infinite alternate}
.d-bang .m-armL{animation:rockL .28s ease-in infinite alternate}
.d-bang .m-armR{animation:rockR .56s ease-in-out infinite alternate}
.d-bang .m-all{animation:squash .28s ease-in infinite alternate}
@keyframes bang{from{transform:rotate(-6deg) translateY(-2px)}to{transform:rotate(18deg) translateY(6px)}}
@keyframes rockL{from{transform:rotate(100deg)}to{transform:rotate(140deg)}}
@keyframes rockR{from{transform:rotate(-30deg)}to{transform:rotate(-80deg)}}

/* dance 10: glitchy teleport */
svg.d-glitch{animation:glitchF 1.2s steps(1) infinite}
.d-glitch .m-all{animation:glitch 1.2s steps(1) infinite}
.d-glitch .m-head{animation:glitchH .6s steps(1) infinite}
.d-glitch .m-armL{animation:robArmL .6s steps(4) infinite}
.d-glitch .m-armR{animation:robArmR .6s steps(4) infinite}
@keyframes glitch{0%{transform:none;opacity:1}10%{transform:translate(-6px,2px) skewX(12deg);opacity:.6}20%{transform:translate(5px,-3px);opacity:1}30%{transform:none}55%{transform:translate(0,-10px) scale(1.08,.9);opacity:.4}60%{transform:none;opacity:1}80%{transform:translate(8px,0) skewX(-14deg)}90%{transform:none}}
@keyframes glitchH{0%{transform:none}25%{transform:translateX(5px)}50%{transform:translateX(-5px) rotate(-8deg)}75%{transform:translateY(-4px)}}
@keyframes glitchF{0%{filter:none}10%{filter:hue-rotate(90deg) saturate(2)}20%{filter:none}55%{filter:hue-rotate(200deg)}60%{filter:none}80%{filter:hue-rotate(-90deg) contrast(1.5)}90%{filter:none}}

.mascot.boing svg{animation:boing .5s cubic-bezier(.3,1.6,.5,1)}
@keyframes boing{0%{transform:scale(1)}30%{transform:scale(.85,1.15)}60%{transform:scale(1.1,.9)}100%{transform:scale(1)}}

.m-bubble{position:absolute;left:62%;bottom:100%;margin-bottom:-6px;background:var(--card);color:var(--ink);border:2px solid var(--ink);border-radius:16px 16px 16px 4px;padding:6px 10px;font-size:13px;font-weight:700;white-space:nowrap;pointer-events:none;opacity:0;transform:translateY(6px) scale(.8);transform-origin:left bottom;transition:opacity .2s,transform .25s cubic-bezier(.3,1.6,.5,1)}
.m-bubble.on{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){.mascot *{animation-duration:3s!important}}

/* ---------- mobile ---------- */
@media (max-width:700px){
  .wrap{padding:0 14px calc(150px + var(--safe-b))}
  header{flex-wrap:wrap;gap:6px 10px}
  header h1{font-size:18px}
  .month-nav{order:3;width:100%;justify-content:space-between;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:3px}
  .month-nav .btn.icon{border:0;background:none;width:44px;min-height:40px}
  .month-nav b{flex:1}
  .tabs{position:fixed;left:0;right:0;bottom:0;z-index:15;margin:0;border-radius:0;border:0;border-top:1px solid var(--line);padding:6px 6px calc(6px + var(--safe-b));gap:0}
  .tabs button{flex-direction:column;gap:2px;font-size:11px;padding:6px 2px;border-radius:10px}
  .tabs button svg{display:block;width:22px;height:22px}
  .tabs button.on{background:none;color:var(--accent)}
  .fab{right:16px;bottom:calc(76px + var(--safe-b))}
  .mascot{left:6px;bottom:calc(70px + var(--safe-b));width:70px}
  .grid4{grid-template-columns:1fr 1fr;gap:8px}
  .grid4 .stat.hero{grid-column:span 2;display:flex;align-items:baseline;justify-content:space-between;flex-wrap:wrap}
  .grid4 .stat.hero b{font-size:26px}
  .grid4 .stat:last-child:nth-child(even){grid-column:span 2}
  .stat{padding:10px 12px}
  .stat b{font-size:17px}
  .card{padding:12px 14px}
  .year{height:150px;gap:3px}
  .ylabels{gap:3px;font-size:10px}
  dialog{width:100%;max-width:100%;margin:auto 0 0;border-radius:18px 18px 0 0;border-bottom:0;max-height:92vh}
  dialog form{padding:12px 18px calc(18px + var(--safe-b))}
  dialog form::before{content:"";display:block;width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 12px}
  .actions .btn{min-height:46px;flex:1}
  .actions .del{flex:0 0 auto}
  footer{display:none}
}
</style>
</head>

let S, memStore = null;
function load() {
  try { const raw = localStorage.getItem(KEY); if (raw) return JSON.parse(raw); } catch (e) {}
  if (memStore) return memStore;
  const nav = (navigator.language || '').toLowerCase();
  return demo(nav.startsWith('uk') || nav.startsWith('ru-ua') ? 'uk' : 'be');
}

/* ---------- helpers ---------- */
let cur = ym(new Date());
let tab = 'month';
const money = n => Math.round(n).toLocaleString('uk-UA').replace(/[\s,  ]/g, ' ') + ' ' + S.settings.currency;
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const mDiff = (a, b) => { const [y1, m1] = a.split('-').map(Number), [y2, m2] = b.split('-').map(Number); return (y2 - y1) * 12 + (m2 - m1); };
const shift = (m, n) => { const [y, mm] = m.split('-').map(Number); return ym(new Date(y, mm - 1 + n, 1)); };
const sum = (arr, f) => arr.reduce((a, x) => a + (f ? f(x) : x), 0);
const fmtDate = d => { const [, m, dd] = d.split('-').map(Number); return dd + ' ' + L('mshort')[m - 1]; };
const defaultDate = () => cur === ym(new Date()) ? todayISO() : cur + '-01';

function recInMonth(r, m) {
  if (!r.active) return 0;
  const d = mDiff(r.start, m);
  if (d < 0) return 0;
  if (r.period === 'month') return r.amount;
  if (r.period === 'quarter') return d % 3 === 0 ? r.amount : 0;
  if (r.period === 'year') return d % 12 === 0 ? r.amount : 0;
  if (r.period === 'week') { const [y, mm] = m.split('-').map(Number); return r.amount * Math.round(new Date(y, mm, 0).getDate() / 7 * 10) / 10; }
  return 0;
}
const recMonthlyAvg = r => !r.active ? 0 : ({ week: r.amount * 52 / 12, month: r.amount, quarter: r.amount / 3, year: r.amount / 12 }[r.period]);

function monthCalc(m) {
  const income = sum(S.incomes, i => i.amount);
  const recs = S.recurring.map(r => ({ r, amt: recInMonth(r, m), paid: !!(S.paid[r.id] || {})[m] })).filter(x => x.amt > 0);
  const recTotal = sum(recs, x => x.amt), recPaid = sum(recs.filter(x => x.paid), x => x.amt);
  const buds = S.budgets.map(b => { const sp = S.spends.filter(s => s.budgetId === b.id && s.date.startsWith(m)); return { b, spends: sp, spent: sum(sp, s => s.amount) }; });
  const budPlan = sum(buds, x => Math.max(x.b.limit, x.spent)), budSpent = sum(buds, x => x.spent);
  const ones = S.oneoffs.filter(o => o.date.startsWith(m)).sort((a, b) => a.date.localeCompare(b.date));
  const oneTotal = sum(ones, o => o.amount), onePaid = sum(ones.filter(o => o.paid), o => o.amount);
  const jarNet = sum((S.jarMoves || []).filter(x => x.date.startsWith(m)), x => x.amount);
  const planned = recTotal + budPlan + oneTotal + jarNet;
  return { income, recs, recTotal, recPaid, buds, budPlan, budSpent, ones, oneTotal, onePaid, jarNet, planned, fact: recPaid + budSpent + onePaid + jarNet, free: income - planned };
}

/* ---------- dialog ---------- */
const dlg = document.getElementById('dlg'), dlgForm = document.getElementById('dlgForm');
dlg.addEventListener('click', e => { if (e.target === dlg) dlg.close(); }); // tap backdrop to close

function openForm(title, fields, onSave, onDelete) {
  dlgForm.innerHTML = `<h3>${title}</h3>` + fields.map(f => {
    if (f.type === 'chips') return `<div class="field"><span>${f.label}</span><div class="chips">${f.options.map(([v, l]) => `<label><input type="radio" name="${f.name}" value="${v}" ${v == f.value ? 'checked' : ''}><span>${esc(l)}</span></label>`).join('')}</div></div>`;
    if (f.type === 'swatch') return `<div class="field"><span>${f.label}</span><div class="swatches">${f.options.map(v => `<label><input type="radio" name="${f.name}" value="${v}" ${v == f.value ? 'checked' : ''}><i style="background:${v}"></i></label>`).join('')}</div></div>`;
    if (f.type === 'select') return `<label class="field"><span>${f.label}</span><select name="${f.name}">${f.options.map(([v, l]) => `<option value="${v}" ${v == f.value ? 'selected' : ''}>${l}</option>`).join('')}</select></label>`;
    if (f.type === 'checkbox') return `<label class="field inline"><input type="checkbox" class="chk" name="${f.name}" ${f.value ? 'checked' : ''}> ${f.label}</label>`;
    const num = f.type === 'number';
    return `<label class="field"><span>${f.label}</span><input name="${f.name}" type="${num ? 'text' : f.type || 'text'}" ${num ? 'inputmode="decimal" pattern="[0-9]*[.,]?[0-9]*" autocomplete="off"' : ''} ${f.big ? 'class="big"' : ''} value="${esc(f.value ?? '')}" ${f.req ? 'required' : ''}></label>`;
  }).join('') + `<div class="actions">${onDelete ? `<button type="button" class="btn ghost del" id="dDel">${t('del')}</button>` : ''}
    <button type="button" class="btn" id="dCancel">${t('cancel')}</button><button class="btn primary" value="ok">${t('save')}</button></div>`;
  dlgForm.onsubmit = e => {
    e.preventDefault();
    const fd = new FormData(dlgForm), o = {};
    fields.forEach(f => { const v = fd.get(f.name); o[f.name] = f.type === 'checkbox' ? fd.has(f.name) : f.type === 'number' ? parseFloat(String(v || '').replace(',', '.').replace(/\s/g, '')) || 0 : String(v || '').trim(); });
    onSave(o); save(); dlg.close(); render();
  };
  dlgForm.querySelector('#dCancel').onclick = () => dlg.close();
  if (onDelete) dlgForm.querySelector('#dDel').onclick = () => { if (confirm(t('confirmDel'))) { onDelete(); save(); dlg.close(); render(); } };
  dlg.showModal();
  const first = dlgForm.querySelector('input.big') || dlgForm.querySelector('input[type=text]');
  setTimeout(() => first?.focus(), 60);
}

  openForm(isNew ? t('newRec') : t('editRec'), [

    { name: 'day', label: t('fDay'), type: 'number', value: r.day },

function budForm(b) {

// budgetId optional: when opened from FAB the category is picked with chips
function spendForm(budgetId, s) {
  if (!S.budgets.length) { alert(t('needCat')); return budForm(); }
  const isNew = !s;
  s = s || { amount: '', date: defaultDate(), note: '', budgetId: budgetId || S.budgets[0].id };
  openForm(t('spendT'), [
    { name: 'amount', label: t('fAmount'), type: 'number', value: s.amount, req: true, big: true },
    { name: 'budgetId', label: t('fCat'), type: 'chips', value: s.budgetId, options: S.budgets.map(b => [b.id, b.name]) },
    { name: 'note', label: t('fNote'), value: s.note },
    { name: 'date', label: t('fDate'), type: 'date', value: s.date, req: true },
  ], v => {
    const bb = find(S.budgets, v.budgetId), m = v.date.slice(0, 7);
    const was = sum(S.spends.filter(x => x.budgetId === v.budgetId && x.date.startsWith(m) && x !== s), x => x.amount);
    if (isNew) S.spends.push({ id: uid(), ...v }); else Object.assign(s, v);
    if (bb && was <= bb.limit && was + v.amount > bb.limit) mascotEvent('over');
  },
  isNew ? null : () => { S.spends = S.spends.filter(x => x !== s); });
}
function incForm(i) {
  const isNew = !i; i = i || { name: '', amount: '' };
  openForm(isNew ? t('newInc') : t('inc'), [
    { name: 'name', label: t('fName'), value: i.name, req: true },
    { name: 'amount', label: t('fIncAmt'), type: 'number', value: i.amount, req: true },

  isNew ? null : () => { S.incomes = S.incomes.filter(x => x !== i); });
}

/* ---------- events ---------- */
const find = (arr, id) => arr.find(x => x.id === id);
view.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const id = el.dataset.id;
  ({
    addRec: () => recForm(), editRec: () => recForm(find(S.recurring, id)),
    addOne: () => oneForm(), editOne: () => oneForm(find(S.oneoffs, id)),
    addBud: () => budForm(), editBud: () => budForm(find(S.budgets, id)),
    addSpend: () => spendForm(id), showSpends: () => showSpends(id),
    addInc: () => incForm(), editInc: () => incForm(find(S.incomes, id)),
    togglePaid: () => {
      (S.paid[id] = S.paid[id] || {})[cur] = el.checked; save();
      if (el.checked) { const c = monthCalc(cur); if (c.recs.every(x => x.paid)) { celebrate(null, 'big'); mascotEvent('allPaid'); } else { celebrate(el, 'small'); mascotEvent('paid'); } }
      render();
    },
    toggleOne: () => { find(S.oneoffs, id).paid = el.checked; save(); if (el.checked) { celebrate(el, 'small'); mascotEvent('paid'); } render(); },
    addJar: () => jarForm(), showJar: () => showJar(id), depJar: () => moveForm(id, 1), wrapped: () => openWrapped(),
    goMonth: () => { cur = el.dataset.m; tab = 'month'; render(); },
    export: () => {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([JSON.stringify(S, null, 2)], { type: 'application/json' }));
      a.download = `kapshuk-${todayISO()}.json`; a.click();
    },
    import: () => document.getElementById('file').click(),
    reset: () => { if (confirm(t('confirmReset'))) { S = { settings: S.settings, incomes: [], recurring: [], budgets: [], spends: [], oneoffs: [], paid: {} }; save(); render(); } },
  })[el.dataset.act]?.();
});
view.addEventListener('change', e => {
  if (e.target.id === 'currency') { S.settings.currency = e.target.value.trim() || 'Kč'; save(); render(); }
  if (e.target.id === 'theme') { S.settings.theme = e.target.value; applyTheme(); save(); }
  if (e.target.id === 'langSel') setLang(e.target.value);
  if (e.target.id === 'confTgl') { S.settings.confetti = e.target.checked; save(); if (e.target.checked) celebrate(e.target, 'mid'); }
  if (e.target.id === 'seasonSel') { S.settings.season = e.target.value; save(); applySeason(); const ph = themeSay(); if (ph) mascotSay(ph); if ((THEMES[e.target.value] || {}).party) celebrate(null, 'big'); }
  if (e.target.id === 'bdaySel') { S.settings.birthday = e.target.value; seasonNow = '-'; save(); applySeason(); }
  if (e.target.id === 'mascotTgl') { S.settings.mascot = e.target.checked; save(); mascotShow(); }
  if (e.target.id === 'file') {
    const f = e.target.files[0]; if (!f) return;
    f.text().then(txt => { try { const d = JSON.parse(txt); if (!d.recurring) throw 0; S = d; LANG = S.settings.lang || LANG; save(); render(); alert(t('imported')); } catch (_) { alert(t('importFail')); } });
  }
});
function setLang(l) { LANG = l; S.settings.lang = l; save(); render(); }
document.getElementById('lang').onclick = e => { const b = e.target.closest('button'); if (b) setLang(b.dataset.l); };
document.getElementById('tabs').onclick = e => { const b = e.target.closest('button'); if (b) { tab = b.dataset.tab; render(); scrollTo(0, 0); } };
const go = n => { cur = shift(cur, tab === 'year' ? 12 * n : n); render(); };
document.getElementById('prev').onclick = () => go(-1);
document.getElementById('next').onclick = () => go(1);
document.getElementById('today').onclick = () => { cur = ym(new Date()); render(); };
document.getElementById('fab').onclick = quickAdd;

// swipe left/right to change month
let tx = 0, ty = 0, skip = false;
view.addEventListener('touchstart', e => { const p = e.touches[0]; tx = p.clientX; ty = p.clientY; skip = !!e.target.closest('.tblwrap'); }, { passive: true });
view.addEventListener('touchend', e => {
  if (skip || tab === 'settings' || tab === 'recurring') return;
  const p = e.changedTouches[0], dx = p.clientX - tx, dy = p.clientY - ty;
  if (Math.abs(dx) > 70 && Math.abs(dy) < 40) go(dx < 0 ? 1 : -1);
}, { passive: true });

function applyTheme() { const th = S.settings.theme; th ? document.documentElement.setAttribute('data-theme', th) : document.documentElement.removeAttribute('data-theme'); }
/* ---------- jars ---------- */
const JAR_COLORS = ['#7a5cc2', '#2f8f7a', '#d0763a', '#c2477a', '#3d7dd6', '#c9a227'];
const JAR_ICONS = ['🛸', '✈️', '🛶', '🥁', '🐱', '🎁', '🏠', '💻', '🎄', '🌴', '📷', '🛟'];
const jarSaved = j => sum(S.jarMoves.filter(m => m.jarId === j.id), m => m.amount);
function jarEta(j) {
  const left = j.goal - jarSaved(j); if (left <= 0) return t('jarDone');
  const months = [0, 1, 2].map(i => shift(ym(new Date()), -i));
  const avg = sum(S.jarMoves.filter(m => m.jarId === j.id && months.some(mm => m.date.startsWith(mm))), m => m.amount) / 3;
  return avg > 0 ? t('eta', Math.ceil(left / avg)) : t('etaNone');
}
function jarSvg(j, uidx) {
  const pct = j.goal ? Math.max(0, Math.min(1, jarSaved(j) / j.goal)) : 0;
  const y = 112 - pct * 82 - 5, id = 'jc' + j.id + (uidx || '');
  const wave = 'M-50 6 Q-37.5 0 -25 6 T0 6 T25 6 T50 6 T75 6 T100 6 T125 6 T150 6 T175 6 V140 H-50 Z';
  return `<svg class="jar" viewBox="0 0 100 120"><defs><clipPath id="${id}"><path d="M24 30 Q18 34 18 46 L18 100 Q18 112 30 112 L70 112 Q82 112 82 100 L82 46 Q82 34 76 30 Z"/></clipPath></defs>
    <g clip-path="url(#${id})"><rect class="glass" x="0" y="0" width="100" height="120"/>
      <g class="fill" style="transform:translateY(${pct > 0 ? y : 120}px)"><path class="wave2" fill="${j.color}" d="${wave}"/><path class="wave" fill="${j.color}" d="${wave}" transform="translate(0 3)"/></g></g>
    <path class="outline" d="M24 30 Q18 34 18 46 L18 100 Q18 112 30 112 L70 112 Q82 112 82 100 L82 46 Q82 34 76 30 Z"/>
    <path class="shine" d="M27 50 L27 92"/>
    <rect x="22" y="18" width="56" height="13" rx="4" fill="${j.color}" stroke="var(--ink)" stroke-width="2" stroke-opacity=".6"/>
    <text x="50" y="${pct > .55 ? 62 : 74}" font-size="26" text-anchor="middle" dominant-baseline="middle">${j.icon || '🫙'}</text></svg>`;
}
function vJars() {
  const total = sum(S.jars, jarSaved), goals = sum(S.jars, j => j.goal);
  const monthIn = sum(S.jarMoves.filter(m => m.date.startsWith(cur)), m => m.amount);
  return `
  <div class="grid4">
    <div class="stat hero"><small>${t('totalSaved')}</small><b>${money(total)}</b><div class="sub">${goals ? t('ofGoal', Math.round(total / goals * 100)) : ''}</div></div>
    <div class="stat"><small>${t('jarsMonth')}</small><b>${money(monthIn)}</b></div>
    <div class="stat"><small>${t('fGoal')}</small><b>${money(goals)}</b></div>
  </div>
  <p class="hint" style="margin:0 2px 10px">${t('jarHint')}</p>
  <div class="jars">
    ${S.jars.map(j => { const sv = jarSaved(j); return `<div class="jar-card" data-act="showJar" data-id="${j.id}">
      <button class="btn round primary jadd" data-act="depJar" data-id="${j.id}" aria-label="+">+</button>
      ${jarSvg(j)}
      <div class="jn">${esc(j.name)}</div>
      <div class="jm">${money(sv)} / ${money(j.goal)}</div>
      <div class="jm">${jarEta(j)}</div></div>`; }).join('')}
    <div class="jar-card" data-act="addJar" style="display:flex;align-items:center;justify-content:center;min-height:180px;border-style:dashed;color:var(--muted)">${t('newJar')}<br>＋</div>
  </div>
  ${S.jars.length ? '' : `<p class="empty">${t('jarNone')}</p>`}`;
}
function jarForm(j) {
  const isNew = !j; j = j || { name: '', goal: '', icon: JAR_ICONS[0], color: JAR_COLORS[0] };
  openForm(isNew ? t('newJar') : t('jarT'), [
    { name: 'name', label: t('fName'), value: j.name, req: true },
    { name: 'goal', label: t('fGoal'), type: 'number', value: j.goal, req: true },
    { name: 'icon', label: t('fIcon'), type: 'chips', value: j.icon, options: JAR_ICONS.map(i => [i, i]) },
    { name: 'color', label: t('fColor'), type: 'swatch', value: j.color, options: JAR_COLORS },
  ], v => { if (isNew) S.jars.push({ id: uid(), ...v }); else Object.assign(j, v); },
  isNew ? null : () => { S.jars = S.jars.filter(x => x !== j); S.jarMoves = S.jarMoves.filter(m => m.jarId !== j.id); });
}
function moveForm(jarId, sign, m) {
  const j = find(S.jars, jarId), isNew = !m;
  m = m || { amount: '', date: defaultDate(), note: '' };
  const before = jarSaved(j);
  openForm((sign < 0 ? t('wdT', esc(j.name)) : t('depT', esc(j.name))), [
    { name: 'amount', label: t('fAmount'), type: 'number', value: m.amount ? Math.abs(m.amount) : '', req: true, big: true },
    { name: 'note', label: t('fNote'), value: m.note },
    { name: 'date', label: t('fDate'), type: 'date', value: m.date, req: true },
  ], v => {
    const amt = Math.abs(v.amount) * (isNew ? sign : Math.sign(m.amount) || 1);
    if (isNew) S.jarMoves.push({ id: uid(), jarId, amount: amt, date: v.date, note: v.note }); else Object.assign(m, { ...v, amount: amt });
    if (amt > 0) {
      const after = before + amt;
      if (before < j.goal && after >= j.goal) { celebrate(null, 'big'); mascotEvent('goal'); }
      else { celebrate(null, 'mid'); mascotEvent('jar'); }
    }
  }, isNew ? null : () => { S.jarMoves = S.jarMoves.filter(x => x !== m); });
}
function showJar(jarId) {
  const j = find(S.jars, jarId);
  const list = S.jarMoves.filter(m => m.jarId === jarId).sort((a, z) => z.date.localeCompare(a.date));
  dlgForm.innerHTML = `<div style="display:flex;align-items:center;gap:14px;margin-bottom:6px">${jarSvg(j, 'd').replace('class="jar"', 'class="jar" style="width:72px;margin:0"')}
      <div><h3 style="margin:0">${esc(j.name)}</h3><div class="meta" style="color:var(--muted);font-size:13px">${money(jarSaved(j))} / ${money(j.goal)} · ${jarEta(j)}</div></div></div>
    <div style="font-size:12px;color:var(--muted);margin:10px 0 2px">${t('jarMoves')}</div>
    ${list.map(m => `<div class="row tap" data-mid="${m.id}"><div class="name"><div>${esc(m.note) || '—'}</div><div class="meta">${fmtDate(m.date)}</div></div>
      <div class="amt ${m.amount < 0 ? 'neg' : ''}">${m.amount > 0 ? '+' : '−'}${money(Math.abs(m.amount))}</div></div>`).join('') || `<div class="empty">${t('noMoves')}</div>`}
    <div class="actions" style="flex-wrap:wrap"><button type="button" class="btn ghost" id="jSet">⚙</button><button type="button" class="btn" id="jOut">${t('withdraw')}</button><button type="button" class="btn primary" id="jIn">${t('deposit')}</button></div>`;
  dlgForm.onsubmit = e => e.preventDefault();
  dlgForm.querySelector('#jSet').onclick = () => { dlg.close(); jarForm(j); };
  dlgForm.querySelector('#jIn').onclick = () => { dlg.close(); moveForm(jarId, 1); };
  dlgForm.querySelector('#jOut').onclick = () => { dlg.close(); moveForm(jarId, -1); };
  dlgForm.querySelectorAll('[data-mid]').forEach(el => el.onclick = () => { dlg.close(); const m = find(S.jarMoves, el.dataset.mid); moveForm(jarId, Math.sign(m.amount), m); });
  dlg.showModal();
}
function pickJar() {
  if (!S.jars.length) return jarForm();
  if (S.jars.length === 1) return moveForm(S.jars[0].id, 1);
  dlgForm.innerHTML = `<h3>${t('qJar')}</h3><div class="mini-jars" style="flex-wrap:wrap;gap:10px">${S.jars.map(j => `<div class="mj" data-jid="${j.id}">${jarSvg(j, 'p')}<b>${esc(j.name)}</b></div>`).join('')}</div>`;
  dlgForm.onsubmit = e => e.preventDefault();
  dlgForm.querySelectorAll('[data-jid]').forEach(el => el.onclick = () => { dlg.close(); moveForm(el.dataset.jid, 1); });

}

/* ---------- confetti ---------- */
const cv = document.getElementById('confetti'), cx = cv.getContext('2d');
let parts = [], cRaf = 0;
const C_COLORS = ['#ffcf3f', '#ff6b8b', '#6cd47a', '#5aa9ff', '#b48cff', '#ff9a3c', '#d4ff6e'];
function confetti(x, y, n, power) {
  if (S.settings.confetti === false) return;
  const dpr = devicePixelRatio || 1;
  cv.width = innerWidth * dpr; cv.height = innerHeight * dpr; cx.setTransform(dpr, 0, 0, dpr, 0, 0);
  for (let i = 0; i < n; i++) {
    const a = -Math.PI / 2 + (Math.random() - .5) * 2.2, v = (4 + Math.random() * 7) * power;
    parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, r: Math.random() * 6.28, vr: (Math.random() - .5) * .4,
      w: 5 + Math.random() * 6, h: 3 + Math.random() * 5, c: C_COLORS[i % C_COLORS.length], life: 1, shape: Math.random() < .2 ? 'c' : Math.random() < .1 ? 's' : 'r' });
  }
  if (!cRaf) cRaf = requestAnimationFrame(cTick);
}
function cTick() {
  cx.clearRect(0, 0, innerWidth, innerHeight);
  parts = parts.filter(p => p.life > 0 && p.y < innerHeight + 30);
  for (const p of parts) {
    p.vy += .22; p.vx *= .985; p.vy *= .985; p.x += p.vx; p.y += p.vy; p.r += p.vr; p.life -= .006;
    cx.save(); cx.globalAlpha = Math.min(1, p.life * 2); cx.translate(p.x, p.y); cx.rotate(p.r); cx.fillStyle = p.c;
    if (p.shape === 'c') { cx.beginPath(); cx.arc(0, 0, p.w / 2, 0, 6.28); cx.fill(); }
    else if (p.shape === 's') { cx.font = '14px sans-serif'; cx.fillText('✦', -5, 5); }
    else { cx.scale(1, Math.cos(p.r * 3)); cx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); }
    cx.restore();
  }
  cRaf = parts.length ? requestAnimationFrame(cTick) : 0;
  if (!parts.length) cx.clearRect(0, 0, innerWidth, innerHeight);
}
function celebrate(el, size) {
  let x = innerWidth / 2, y = innerHeight * .55;
  if (el) { const r = el.getBoundingClientRect(); x = r.left + r.width / 2; y = r.top + r.height / 2; }
  if (size === 'big') { confetti(innerWidth * .2, innerHeight * .8, 90, 1.5); confetti(innerWidth * .8, innerHeight * .8, 90, 1.5); setTimeout(() => confetti(innerWidth / 2, innerHeight * .7, 80, 1.4), 250); }
  else if (size === 'mid') confetti(x, y, 70, 1.1);
  else confetti(x, y, 28, .7);
  try { navigator.vibrate && navigator.vibrate(size === 'big' ? [20, 40, 20] : 12); } catch (e) {}
}

const SEASON_KEYS = ['winter', 'spring', 'summer', 'autumn'];
const HOLIDAY_KEYS = ['svitlanka', 'birthday', 'newyear', 'sobornist', 'valentine', 'maslyana', 'women', 'shevchenko', 'pi', 'fools', 'cosmo', 'easter', 'vyshyvanka', 'triytsia', 'constitution', 'kupala', 'cats', 'spas', 'flag', 'independence', 'halloween', 'dziady', 'mova', 'andriy', 'mikulas'];
function easterW(y) { const a = y % 19, b = Math.floor(y / 100), c = y % 100, d = Math.floor(b / 4), e = b % 4, f = Math.floor((b + 8) / 25), g = Math.floor((b - f + 1) / 3), h = (19 * a + b - d - g + 15) % 30, i = Math.floor(c / 4), k = c % 4, l = (32 + 2 * e + 2 * i - h - k) % 7, m = Math.floor((a + 11 * h + 22 * l) / 451), mo = Math.floor((h + l - 7 * m + 114) / 31), da = ((h + l - 7 * m + 114) % 31) + 1; return new Date(y, mo - 1, da); }
function easterO(y) { const a = y % 4, b = y % 7, c = y % 19, d = (19 * c + 15) % 30, e = (2 * a + 4 * b - d + 34) % 7, mo = Math.floor((d + e + 114) / 31), da = ((d + e + 114) % 31) + 1; return new Date(y, mo - 1, da + 13); }
function holidayOf(dt) {

  const bd = S.settings.birthday;
  if (bd && +bd.slice(5, 7) * 100 + +bd.slice(8, 10) === md) return 'birthday';
  if (md === 925) return 'svitlanka';
  const dd = e => Math.round((new Date(y, dt.getMonth(), dt.getDate()) - e) / 864e5);
  for (const e of [easterW(y), easterO(y)]) { const diff = dd(e); if (diff >= -2 && diff <= 1) return 'easter'; }
  const eo = dd(easterO(y));
  if (eo >= -55 && eo <= -49) return 'maslyana';
  if (eo >= 49 && eo <= 50) return 'triytsia';
  if (dt.getMonth() === 4 && dt.getDay() === 4 && dt.getDate() >= 15 && dt.getDate() <= 21) return 'vyshyvanka';
  if (md >= 1220 || md <= 107) return 'newyear';
  const R = [[1205, 1206, 'mikulas'], [122, 122, 'sobornist'], [212, 214, 'valentine'], [307, 308, 'women'], [309, 309, 'shevchenko'], [314, 314, 'pi'], [401, 401, 'fools'], [412, 412, 'cosmo'],
    [628, 628, 'constitution'], [706, 707, 'kupala'], [808, 808, 'cats'], [819, 819, 'spas'], [823, 823, 'flag'], [824, 824, 'independence'], [1029, 1031, 'halloween'], [1101, 1102, 'dziady'], [1109, 1109, 'mova'], [1130, 1130, 'andriy']];
  for (const [a, b, k] of R) if (md >= a && md <= b) return k;

}
function seasonOf(m) { const mm = +m.slice(5); return mm === 12 || mm <= 2 ? 'winter' : mm <= 5 ? 'spring' : mm <= 8 ? 'summer' : 'autumn'; }

function wrappedData(m) {

  const spends = S.spends.filter(s => s.date.startsWith(m));
  const days = +new Date(+m.slice(0, 4), +m.slice(5), 0).getDate();

  const biggest = items.sort((a, b) => b.amount - a.amount)[0];
  const byDay = {}; spends.forEach(s => byDay[s.date] = (byDay[s.date] || 0) + s.amount);
  const topDay = Object.entries(byDay).sort((a, b) => b[1] - a[1])[0];

  const over = c.buds.filter(x => x.spent > x.b.limit).map(x => x.b.name);
  const ratio = c.income ? c.free / c.income : 0;

}
