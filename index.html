    `<label><input type="radio" name="dc" value="${c}"${c === d.color ? ' checked' : ''} aria-label="Колер ${c}"><span><i class="swatch" style="--c:${c};width:16px;height:16px;border-radius:50%"></i></span></label>`).join('');
  $('#drAchieve').textContent = d.done ? 'Вярнуць у мары' : 'Здзейснена';
  $('#dreamEd').showModal();
  if (matchMedia('(hover: hover)').matches) $('#drTitle').focus();
}
function saveDreamFields(d) {
  const title = $('#drTitle').value.trim();
  if (title) d.title = title;
  d.note = $('#drNote').value.trim();
  d.color = $('#drForm').querySelector('input[name=dc]:checked')?.value || d.color;
}
$('#drForm').addEventListener('submit', e => {
  e.preventDefault();
  const d = dreamById(editingDream); if (!d) return $('#dreamEd').close();
  saveDreamFields(d); save(); $('#dreamEd').close(); render();
});
$('#drAchieve').addEventListener('click', () => {
  const d = dreamById(editingDream); if (!d) return;
  snap();
  saveDreamFields(d);
  d.done = !d.done;
  if (d.done) d.doneOn = iso(today0()); else delete d.doneOn;
  save(); $('#dreamEd').close(); render();
  toast(d.done ? 'Мара здзейснена! Зорка ўжо ў «Зроблена»' : 'Мара зноў у спісе', true);
});
$('#drDelete').addEventListener('click', () => {
  const d = dreamById(editingDream); if (!d) return;
  snap();
  db.tasks.forEach(t => {
    if (t.goal === d.id) t.goal = '';
    if (t.where === 'g:' + d.id) insertInto(t, 'someday');
  });
  db.dreams = db.dreams.filter(x => x.id !== d.id);
  save(); $('#dreamEd').close(); render();
  toast('Мара выдалена, яе крокі ляжаць у «Калісьці»', true);
});
$$('dialog').forEach(d => d.addEventListener('click', e => { if (e.target === d) d.close(); }));

/* ---------- settings ---------- */
function fillSettings() { $('#nameA').value = db.people.a.name; $('#nameB').value = db.people.b.name; renderCatList(); }
let openPalette = null;
function renderCatList() {
  $('#catList').innerHTML = db.cats.map(c => {
    const n = db.tasks.filter(t => t.cat === c.id).length;
    const pal = openPalette === c.id
      ? `<div class="palette">${PALETTE.map(col => `<button type="button" data-color="${col}" style="--c:${col}" aria-label="Колер ${col}" aria-pressed="${col === c.color}"></button>`).join('')}</div>` : '';
    return `<div class="catrow" data-cat="${esc(c.id)}">`
      + `<button type="button" class="catsw" style="--c:${c.color}" aria-label="Памяняць колер «${esc(c.name)}»" aria-expanded="${openPalette === c.id}"></button>`
      + `<input class="catname" value="${esc(c.name)}" maxlength="24" aria-label="Назва катэгорыі">`
      + `<span class="catn" title="Колькі спраў">${n || ''}</span>`
      + `<button type="button" class="catdel" aria-label="Выдаліць «${esc(c.name)}»">×</button>${pal}</div>`;
  }).join('') || '<p class="hint">Катэгорый няма. Дадайце першую.</p>';
}
$('#catList').addEventListener('click', e => {
  const row = e.target.closest('.catrow'); if (!row) return;
  const c = catById(row.dataset.cat); if (!c) return;
  if (e.target.closest('.catsw')) { openPalette = openPalette === c.id ? null : c.id; return renderCatList(); }
  const col = e.target.closest('[data-color]');
  if (col) { c.color = col.dataset.color; openPalette = null; save(); renderCatList(); return render(); }
  if (e.target.closest('.catdel')) {
    snap();
    const n = db.tasks.filter(t => t.cat === c.id).length;
    db.tasks.forEach(t => { if (t.cat === c.id) t.cat = ''; });
    db.cats = db.cats.filter(x => x.id !== c.id);
    save(); renderCatList(); render();
    toast(n ? `Катэгорыя «${c.name}» выдалена, яе справы засталіся без катэгорыі` : `Катэгорыя «${c.name}» выдалена`, true);
  }
});
$('#catList').addEventListener('change', e => {
  if (!e.target.classList.contains('catname')) return;
  const c = catById(e.target.closest('.catrow').dataset.cat); if (!c) return;
  const v = e.target.value.trim();
  if (v) { c.name = v; save(); render(); } else e.target.value = c.name;
});
$('#catAdd').addEventListener('click', () => {
  const c = addCat('Новая');
  renderCatList();
  const inp = $(`#catList .catrow[data-cat="${c.id}"] .catname`);
  inp?.focus(); inp?.select();
  render();
});
$('#settingsBtn').addEventListener('click', () => { fillSettings(); $('#settings').showModal(); });
$('#setClose').addEventListener('click', () => $('#settings').close());
['a', 'b'].forEach(k => {
  $('#name' + k.toUpperCase()).addEventListener('change', e => {
    db.people[k].name = e.target.value.trim() || (k === 'a' ? 'Першы' : 'Другая');
    save(); render();
  });
});
$('#exportBtn').addEventListener('click', async () => {
  const files = {};
  for (const id of new Set(db.tasks.flatMap(t => (t.files || []).map(f => f.id)))) {
    const r = await fileStore.get(id).catch(() => null);
    if (r) files[id] = { full: await blobToData(r.full), thumb: await blobToData(r.thumb), w: r.w, h: r.h };
  }
  const blob = new Blob([JSON.stringify({ ...db, files })], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `shuflyadka-${iso(today0())}.json`;
  document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
});
$('#importBtn').addEventListener('click', () => $('#importFile').click());
$('#importFile').addEventListener('change', async e => {
  const f = e.target.files[0];
  e.target.value = '';
  if (!f) return;
  try {
    const data = JSON.parse(await f.text());
    if (!data || !Array.isArray(data.tasks)) throw new Error('bad');
    for (const [id, f] of Object.entries(data.files || {})) {
      const blob = async d => (await fetch(d)).blob();
      await fileStore.put({ id, full: await blob(f.full), thumb: await blob(f.thumb), w: f.w, h: f.h }).catch(() => {});
      urlCache.delete(id);
    }
    delete data.files;
    snap();
    db = data; normalize(); save(); fillSettings(); render();
    toast(`Загружана: ${sprav(db.tasks.length)}`, true);
  } catch {
    toast('Файл не падыходзіць. Патрэбна копія, спампаваная з гэтай старонкі.');
  }
});
$('#clearBtn').addEventListener('click', () => {
  snap(); db.tasks = []; db.dreams = []; save(); render(); toast('Усё выдалена', true);
});
$('#demoBtn').addEventListener('click', () => {
  snap(); const s = seed(); db.tasks = s.tasks; db.dreams = s.dreams;
  DEFAULT_CATS.forEach(c => { if (!catById(c.id)) db.cats.push({ ...c }); });
  save(); fillSettings(); render(); toast('Дэма-даныя вернуты', true);
});

/* ---------- events ---------- */
app.addEventListener('click', e => {
  const el = e.target;
  const chk = el.closest('.check'); if (chk) return toggleDone(chk.closest('.card').dataset.id);
  const pl = el.closest('.pull'); if (pl) return pull(pl.closest('.card').dataset.id);
  const ng = el.closest('.nudge'); if (ng) return nudge(ng.closest('.card').dataset.id);
  const gv = el.closest('[data-goview]'); if (gv) return goView(gv.dataset.goview);
  const chip = el.closest('.chip');
  if (chip) {
    if (ui.mweek === 'day') {
      const k = chip.dataset.day;
      slide = reduced || k === ui.mday ? '' : (k > ui.mday ? 'slide-l' : 'slide-r');
      ui.mday = k; return render();
    }
    return $('#day-' + chip.dataset.day)?.scrollIntoView({ behavior: reduced ? 'auto' : 'smooth', block: 'start' });
  }
  const bh = el.closest('.bucket-head');
  if (bh) {
    const b = bh.closest('.bucket'), k = b.dataset.key;
    ui.open[k] = !ui.open[k];
    b.classList.toggle('collapsed', !ui.open[k]);
    bh.setAttribute('aria-expanded', String(!!ui.open[k]));
    return saveUI();
  }
  const dh = el.closest('.drow-head');
  if (dh) {
    const row = dh.closest('.drow'), wk = row.dataset.week;
    const open = !row.classList.contains('open');
    row.classList.toggle('open', open);
    dh.setAttribute('aria-expanded', String(open));
    open ? doneOpen.add(wk) : doneOpen.delete(wk);
    return;
  }
  const de = el.closest('[data-dream-edit]'); if (de) return openDreamEditor(de.closest('.dream').dataset.dream);
  const ddone = el.closest('[data-dream-id]'); if (ddone) return openDreamEditor(ddone.dataset.dreamId);
  const ai = el.closest('.ahead-item, .ditem[data-id]'); if (ai) return openEditor(ai.dataset.id);
  const card = el.closest('.card');
  if (card && !justDragged) openEditor(card.dataset.id);
});
app.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.classList?.contains('card')) { e.preventDefault(); openEditor(e.target.dataset.id); }
});
app.addEventListener('submit', e => {
  const f = e.target.closest('.quick'); if (!f) return;
  e.preventDefault();
  const where = f.dataset.where, val = f.elements.q.value;
  const ok = where === '__dream' ? addDream(val) : addTask(where, val);
  if (ok) { refocus = where; render(); }
});

$('#prevWeek').addEventListener('click', () => shiftWeek(-1));
$('#nextWeek').addEventListener('click', () => shiftWeek(1));
$('#todayBtn').addEventListener('click', () => shiftWeek(0));
$('#rollBtn').addEventListener('click', rollover);
$$('#views, #tabbar').forEach(n => n.addEventListener('click', e => {
  const b = e.target.closest('[data-view]'); if (b) goView(b.dataset.view);
}));
$('#mvariant').addEventListener('click', e => {
  const b = e.target.closest('[data-mv]'); if (!b) return;
  ui.mweek = b.dataset.mv; saveUI(); render();
  if (ui.mweek === 'list') requestAnimationFrame(() => $('.day.today')?.scrollIntoView({ block: 'start' }));
});
$('#people').addEventListener('click', e => {
  const b = e.target.closest('[data-who]'); if (!b) return;
  ui.who = b.dataset.who; saveUI(); render();
});
document.addEventListener('keydown', e => {
  if (document.querySelector('dialog[open]') || e.target.closest?.('input, textarea, select')) return;
  if (ui.view !== 'week' || e.altKey || e.ctrlKey || e.metaKey) return;
  const step = mobile && ui.mweek === 'day' ? shiftDay : shiftWeek;
  if (e.key === 'ArrowLeft') step(-1);
  else if (e.key === 'ArrowRight') step(1);
});

// another tab changed the data
window.addEventListener('storage', e => {
  if (e.key !== KEY || dragging) return;
  const fresh = load();
  if (fresh && Array.isArray(fresh.tasks)) { db = fresh; normalize(); render(); }
});

// new day while the page is open
let lastDay = iso(today0());
setInterval(() => {
  const d = iso(today0());
  if (d === lastDay || dragging || document.querySelector('dialog[open]')) return;
  if (ui.weekStart === iso(mondayOf(parseISO(lastDay)))) ui.weekStart = iso(mondayOf(today0()));
  if (ui.mday === lastDay) ui.mday = d;
  lastDay = d; normalize(); render();
}, 60000);

// header / tab bar heights for full-height layouts
// applied on the next frame and only when changed, so the observer never loops
const sizes = { hh: -1, tb: -1 };
const applyH = () => {
  const hh = $('.top').offsetHeight, tb = $('#tabbar').offsetHeight, root = document.documentElement.style;
  if (hh !== sizes.hh) { sizes.hh = hh; root.setProperty('--hh', hh + 'px'); }
  if (tb !== sizes.tb) { sizes.tb = tb; root.setProperty('--tb', tb + 'px'); }
};
let hRaf = 0;
const ro = new ResizeObserver(() => { cancelAnimationFrame(hRaf); hRaf = requestAnimationFrame(applyH); });
ro.observe($('.top')); ro.observe($('#tabbar'));
applyH();

render();
setTimeout(gcFiles, 4000);
if (!window.Sortable) toast('Перацягванне не загрузілася (няма інтэрнэту?). Пераносіць можна праз картку справы.');
})();
</script>
</body>
</html>
